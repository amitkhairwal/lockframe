# Local stack for trying it out and for the CI smoke test. The keys below are throwaway
# values for a container that is only reachable from this machine. Production uses
# real secrets from the host (see docs/DEPLOY.md).
x-env: &env
  NODE_ENV: development
  MONGODB_URI: mongodb://mongo:27017/lockframe
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://s3:8333
  S3_PUBLIC_ENDPOINT: http://localhost:8333
  S3_BUCKET: lockframe
  S3_ACCESS_KEY: devkey
  S3_SECRET_KEY: devsecret
  CORS_ORIGINS: http://localhost:3000
  GROQ_API_KEY: ${GROQ_API_KEY:-}

services:
  mongo:
    image: mongo:8
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      retries: 30
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/s3.json", "-volume.max=20", "-master.volumeSizeLimitMB=1024"]
    volumes:
      - ./deploy/s3.json:/etc/s3.json:ro
    ports:
      - "8333:8333"
  setup:
    build: .
    command: ["npm", "run", "bucket:setup"]
    environment: *env
    depends_on: [s3]
    restart: on-failure
  api:
    build: .
    environment:
      <<: *env
      JWT_SECRET: local-only-secret-local-only-secret-1234
    ports:
      - "3000:3000"
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_started }
      setup: { condition: service_started }
    restart: unless-stopped
  worker:
    build: .
    command: ["npm", "run", "worker"]
    environment: *env
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_started }
      setup: { condition: service_started }
    restart: unless-stopped
