name: ci
on:
  push:
  pull_request:

jobs:
  test:
    # pinned: MongoDB 8 refuses to start on kernel 6.19+, which newer runner images ship (SERVER-121912)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  stack:
    # pinned: MongoDB 8 refuses to start on kernel 6.19+, which newer runner images ship (SERVER-121912)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: docker compose build
      - run: docker compose up -d
      - name: wait for the api
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/healthz && exit 0
            sleep 2
          done
          exit 1
      - name: smoke test
        run: npx tsx scripts/smoke.ts
      - name: logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
          # the tail of each log as one annotation, readable on the run page without signing in
          echo "::error title=compose logs::$( (docker compose ps -a; docker compose logs --no-color --tail=30 mongo redis api worker setup) 2>&1 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
      - run: docker compose down -v
        if: always()
