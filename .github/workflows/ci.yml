name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  stack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: docker compose build
      - run: docker compose up -d
      - name: wait for the api
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/healthz && exit 0
            sleep 2
          done
          docker compose ps -a
          # one annotation with the tail of each service log, readable on the run page without opening the job
          echo "::error title=compose logs::$(docker compose logs --no-color --tail=40 api setup worker s3 2>&1 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          exit 1
      - name: smoke test
        run: npx tsx scripts/smoke.ts
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
